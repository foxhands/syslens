[package]
name = "syslens"
version = "0.4.0"
edition = "2021"
authors = ["Foxhand"]
repository = "https://github.com/foxhands/syslens"
description = "Простая программа для Windows, Linux и macOS: сведения о процессоре, плате, памяти, видеокарте, дисках, сети и установленных программах"
license = "MIT"
readme = "README.md"
keywords = ["windows", "system-info", "hardware", "egui"]
categories = ["gui"]

[dependencies]
eframe = "0.31"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# Live load: processor, memory, network, disks.
sysinfo = { version = "0.33", default-features = false, features = ["system", "network", "disk"] }

# The system's own "Save as" and "Open" windows.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false }

# The icon next to the clock with processor and memory load.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Small, fast single file for GitHub releases.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
