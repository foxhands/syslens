[package]
name = "syslens"
version = "0.3.0"
edition = "2021"
description = "Простая программа для Windows: сведения о процессоре, плате, памяти, видеокарте, дисках, сети и установленных программах"
license = "MIT"
readme = "README.md"
keywords = ["windows", "system-info", "hardware", "egui"]
categories = ["gui"]

[dependencies]
eframe = "0.31"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# Live load: processor, memory, network, disks.
sysinfo = { version = "0.33", default-features = false, features = ["system", "network", "disk"] }

# The system's own "Save as" window.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Small, fast single file for GitHub releases.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
